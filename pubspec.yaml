name: logbook
description: "Logbook is a library for logging and tracking events in a Flutter application."
version: 1.0.0

homepage: https://github.com/gthe-miracle/logbook
repository: https://github.com/gthe-miracle/logbook
issue_tracker: https://github.com/gthe-miracle/logbook/issues

topics:
  - logging
  - debugging
  - developer-tools
  - error-handling
  - monitoring

screenshots:
  - description: "Logbook logo"
    path: screenshots/logo.png
  - description: "Logbook overview showing log messages with different levels"
    path: screenshots/screenshot_1.png
  - description: "Logbook filter functionality"
    path: screenshots/screenshot_2.png
  - description: "Logbook filter options"
    path: screenshots/screenshot_3.png
  - description: "Logbook search feature"
    path: screenshots/screenshot_4.png

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  http: ^1.6.0
  material_ui: ^1.11.0

dev_dependencies:
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
